# fly.toml app configuration file generated for new-lo-bot on 2026-11-02T04:45:49Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'new-lo-bot'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-1x'
